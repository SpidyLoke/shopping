name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix functions
      - name: Server tests
        run: npm run test:server
      - name: Backend loads (Firebase functions)
        run: cd functions && node -e "import('./index.js').then((m) => console.log('exports:', Object.keys(m).join(', ')))"
      - name: App tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
