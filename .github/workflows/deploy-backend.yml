# Deploys the Kaimono backend (functions/ and the database rules) to Firebase, so setting it up
# needs only a phone browser. Off until the repository variable FIREBASE_PROJECT_ID is set.
#
# Needs (GitHub → Settings → Secrets and variables → Actions):
#   variable FIREBASE_PROJECT_ID       the Firebase project ID, e.g. kaimono-check
#   secret   FIREBASE_SERVICE_ACCOUNT  the JSON key of a service account with the roles Editor,
#                                      Secret Manager Admin, API Keys Admin and Service Account User
#   secrets  VISION_KEY, GEMINI_KEY    optional: your own keys; without them the first run makes one
#   secret   STRIPE_SECRET_KEY         optional: turns payments on (sk_test_… to try, sk_live_… to sell)
#   variables PASS_PRICE_SEN, MONTHLY_PRICE_SEN  prices in sen (default 1990 = RM 19.90, 2990 = RM 29.90)
#
# The first run (Actions → Deploy backend → Run workflow) also turns on the Google APIs, creates the
# database in Singapore, makes the backend's API key, sets up auto-deletion of old scan results and
# writes the project's web config into firebase-config.js. Later pushes that touch the backend
# redeploy it.

name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/**', 'prompt.js', 'firestore.rules', 'firebase.json', '.github/workflows/deploy-backend.yml']

permissions:
  contents: write # to commit firebase-config.js on the first run

concurrency: deploy-backend

jobs:
  deploy:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      REGION: asia-southeast1
      FIREBASE: npx -y firebase-tools@15.34.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Turn on the Google APIs the backend uses
        run: |
          gcloud services enable --project "$PROJECT" \
            firebase.googleapis.com firestore.googleapis.com identitytoolkit.googleapis.com \
            vision.googleapis.com generativelanguage.googleapis.com \
            secretmanager.googleapis.com apikeys.googleapis.com \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com

      - name: Create the database (first run only)
        run: |
          if gcloud firestore databases describe --database='(default)' --project "$PROJECT" >/dev/null 2>&1; then
            echo "Database already there."
          else
            gcloud firestore databases create --database='(default)' --location="$REGION" --type=firestore-native --project "$PROJECT"
          fi

      - name: Turn on sign-in (anonymous, and email for accounts)
        run: |
          reply=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "X-Goog-User-Project: $PROJECT" -H "Content-Type: application/json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config?updateMask=signIn.anonymous.enabled,signIn.email.enabled,signIn.email.passwordRequired" \
            -d '{"signIn":{"anonymous":{"enabled":true},"email":{"enabled":true,"passwordRequired":true}}}')
          if echo "$reply" | grep -q '"anonymous"'; then
            echo "Anonymous and email sign-in are on."
          else
            echo "::warning::Couldn't turn on sign-in: open Firebase console → Authentication → Get started → Sign-in method, enable Anonymous and Email/Password, then run this again."
            echo "$reply" | head -c 500
          fi

      - name: Backend API keys
        env:
          VISION_KEY: ${{ secrets.VISION_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -euo pipefail
          put() {
            f="$RUNNER_TEMP/secret"
            printf '%s' "$2" > "$f"
            $FIREBASE functions:secrets:set "$1" --data-file "$f" --project "$PROJECT" --non-interactive
            rm -f "$f"
          }
          has() { gcloud secrets describe "$1" --project "$PROJECT" >/dev/null 2>&1; }
          # Your own keys win when given as repository secrets.
          if [ -n "${VISION_KEY:-}" ]; then put VISION_KEY "$VISION_KEY"; fi
          if [ -n "${GEMINI_KEY:-}" ]; then put GEMINI_KEY "$GEMINI_KEY"; fi
          if has VISION_KEY && has GEMINI_KEY; then echo "Keys already set."; exit 0; fi
          # Otherwise one key, usable only for Vision and Gemini.
          name=$(gcloud services api-keys list --project "$PROJECT" --filter="displayName='Kaimono backend'" --format='value(name)' | head -n1)
          if [ -z "$name" ]; then
            gcloud services api-keys create --project "$PROJECT" --display-name="Kaimono backend" \
              --api-target=service=vision.googleapis.com --api-target=service=generativelanguage.googleapis.com
            name=$(gcloud services api-keys list --project "$PROJECT" --filter="displayName='Kaimono backend'" --format='value(name)' | head -n1)
          fi
          key=$(gcloud services api-keys get-key-string "$name" --format='value(keyString)')
          echo "::add-mask::$key"
          has VISION_KEY || put VISION_KEY "$key"
          has GEMINI_KEY || put GEMINI_KEY "$key"

      - name: Payments (Stripe)
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PASS_PRICE: ${{ vars.PASS_PRICE_SEN || '1990' }}
          MONTHLY_PRICE: ${{ vars.MONTHLY_PRICE_SEN || '2990' }}
        run: |
          set -euo pipefail
          current() { gcloud secrets versions access latest --secret="$1" --project "$PROJECT" 2>/dev/null || true; }
          put() {
            f="$RUNNER_TEMP/secret"
            printf '%s' "$2" > "$f"
            $FIREBASE functions:secrets:set "$1" --data-file "$f" --project "$PROJECT" --non-interactive
            rm -f "$f"
          }
          # The functions need both secrets to exist; "unset" until Stripe is connected.
          [ -n "$(current STRIPE_SECRET_KEY)" ] || put STRIPE_SECRET_KEY unset
          [ -n "$(current STRIPE_WEBHOOK_SECRET)" ] || put STRIPE_WEBHOOK_SECRET unset
          if [ -z "${STRIPE_KEY:-}" ]; then echo "No STRIPE_SECRET_KEY secret yet: payments stay off."; exit 0; fi
          echo "::add-mask::$STRIPE_KEY"
          [ "$(current STRIPE_SECRET_KEY)" = "$STRIPE_KEY" ] || put STRIPE_SECRET_KEY "$STRIPE_KEY"
          api() { curl -sS --fail-with-body -u "$STRIPE_KEY:" "$@"; }

          # Prices, found by lookup key; a changed amount becomes a new price that takes the key over.
          price() { # lookup_key name amount [interval]
            have=$(api -G https://api.stripe.com/v1/prices --data-urlencode "lookup_keys[]=$1" -d active=true | jq -r '.data[0].unit_amount // empty')
            if [ "$have" = "$3" ]; then echo "$1: RM $3 sen, unchanged."; return; fi
            args=(-d currency=myr -d unit_amount="$3" -d lookup_key="$1" -d transfer_lookup_key=true --data-urlencode "product_data[name]=$2")
            [ -n "${4:-}" ] && args+=(-d "recurring[interval]=$4")
            api https://api.stripe.com/v1/prices "${args[@]}" | jq -r '"\(.lookup_key): created \(.id)"'
          }
          price kaimono_pass "Kaimono Check trip pass" "$PASS_PRICE"
          price kaimono_monthly "Kaimono Check monthly" "$MONTHLY_PRICE" month

          # The webhook that tells the backend about payments.
          url="https://$REGION-$PROJECT.cloudfunctions.net/stripeWebhook"
          hook=$(api -G https://api.stripe.com/v1/webhook_endpoints -d limit=100 | jq -r --arg u "$url" '[.data[] | select(.url == $u)][0].id // empty')
          if [ -n "$hook" ] && [ "$(current STRIPE_WEBHOOK_SECRET)" != "unset" ]; then
            echo "Webhook already set up."
          else
            [ -n "$hook" ] && api -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$hook" >/dev/null
            secret=$(api https://api.stripe.com/v1/webhook_endpoints --data-urlencode "url=$url" \
              -d "enabled_events[]=checkout.session.completed" -d "enabled_events[]=checkout.session.async_payment_succeeded" \
              -d "enabled_events[]=customer.subscription.created" -d "enabled_events[]=customer.subscription.updated" \
              -d "enabled_events[]=customer.subscription.deleted" | jq -r .secret)
            echo "::add-mask::$secret"
            put STRIPE_WEBHOOK_SECRET "$secret"
          fi

          # Stripe's customer portal (Manage in Settings): change card, cancel, invoices.
          if [ "$(api -G https://api.stripe.com/v1/billing_portal/configurations -d is_default=true | jq '.data | length')" = "0" ]; then
            api https://api.stripe.com/v1/billing_portal/configurations \
              -d "features[subscription_cancel][enabled]=true" -d "features[payment_method_update][enabled]=true" \
              -d "features[invoice_history][enabled]=true" -d "features[customer_update][enabled]=false" \
              --data-urlencode "business_profile[headline]=Kaimono Check" >/dev/null
            echo "Customer portal set up."
          fi

      - name: Backend settings from repository variables
        env:
          OWNER_UIDS: ${{ vars.OWNER_UIDS }}
          FREE_SCANS: ${{ vars.FREE_SCANS }}
          PRO_SCANS: ${{ vars.PRO_SCANS }}
          PASS_SCANS: ${{ vars.PASS_SCANS }}
          PASS_DAYS: ${{ vars.PASS_DAYS }}
          DAILY_SCANS: ${{ vars.DAILY_SCANS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          # functions/.env has the defaults; this project's overrides go in .env.<project-id>.
          f="functions/.env.$PROJECT"
          : > "$f"
          for name in OWNER_UIDS FREE_SCANS PRO_SCANS PASS_SCANS PASS_DAYS DAILY_SCANS GEMINI_MODEL; do
            value="${!name}"
            if [ -n "$value" ]; then echo "$name=$value" >> "$f"; echo "$name set"; fi
          done

      - name: Deploy functions and database rules
        run: $FIREBASE deploy --only functions,firestore:rules --project "$PROJECT" --non-interactive --force

      - name: Old scan results and counters delete themselves
        run: |
          for group in jobs ipDaily reports feedback events; do
            gcloud firestore fields ttls update expireAt --collection-group="$group" --enable-ttl --async --project "$PROJECT" \
              || echo "::warning::TTL for $group not set (it may already be on)."
          done

      - name: Connect the app to this project (first run only)
        run: |
          set -euo pipefail
          if ! grep -q 'export const FIREBASE = null' firebase-config.js; then echo "Already connected."; exit 0; fi
          app=$($FIREBASE apps:list WEB --project "$PROJECT" --json | node .github/scripts/firebase-web-config.mjs app-id)
          if [ -z "$app" ]; then
            app=$($FIREBASE apps:create WEB "Kaimono Check" --project "$PROJECT" --json | node .github/scripts/firebase-web-config.mjs created-id)
          fi
          $FIREBASE apps:sdkconfig WEB "$app" --project "$PROJECT" --json | node .github/scripts/firebase-web-config.mjs write firebase-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Connect the app to Firebase project $PROJECT"
          git push
